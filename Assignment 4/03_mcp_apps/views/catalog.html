<!doctype html>
<html><head><meta charset="utf-8"><style>/*__CATALOG_CSS__*/ body { background: #fff; padding: 12px; }</style></head>
<body>
  <!-- DECLARATIVE + MIXED: a generic renderer. It knows the catalog, not the layout.
       The layout arrives as data (structuredContent.tree) and is drawn with the catalog.
       HtmlView nodes become a SECOND sandbox nested inside this view's sandbox. -->
  <div id="root" class="c-skeleton">waiting for tool-input…</div>
  <div id="detail" style="margin-top:12px"></div>
<script>/*__CATALOG_JS__*/</script>
<script>/*__BRIDGE_JS__*/</script>
<script>
  const ctx = { onAction: async (name, params) => {
    if (name !== "drill_region") return;
    const res = await app.callTool("drill_region", params);
    paint(document.getElementById("detail"), res.structuredContent.tree, ctx);
    app.say(`Opened ${params.region} detail`);
  } };
  app.on("ui/notifications/tool-input", ({ arguments: a }) => {
    document.getElementById("root").textContent = `tool-input received: ${JSON.stringify(a).length} bytes of spec - waiting for the validated result…`;
  });
  app.on("ui/notifications/tool-result", (r) => {
    const root = document.getElementById("root");
    root.className = "";
    if (r.isError) { root.textContent = r.content[0].text; root.className = "c-error"; return; }
    paint(root, r.structuredContent.tree, ctx);
  });
  app.connect("catalog-renderer");
</script>
</body></html>
