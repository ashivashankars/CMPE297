<!doctype html>
<html><head><meta charset="utf-8"><style>/*__CATALOG_CSS__*/ body { background: #fff; padding: 8px; }</style></head>
<body>
  <!-- OPEN-ENDED: this view is trusted (the server author wrote it). The model's HTML is not,
       so it goes one level deeper: a nested sandboxed iframe with its own CSP. -->
  <div id="root" class="c-skeleton">waiting for tool-result…</div>
  <div id="detail" style="margin-top:12px"></div>
<script>/*__CATALOG_JS__*/</script>
<script>/*__BRIDGE_JS__*/</script>
<script>
  app.on("ui/notifications/tool-result", (r) => {
    const root = document.getElementById("root");
    root.className = ""; root.replaceChildren();
    mountHtml(root, r.structuredContent.html, { title: r.structuredContent.title, allowedActions: ["drill_region"],
      onAction: async (name, params) => {
        const res = await app.callTool(name, params);
        paint(document.getElementById("detail"), res.structuredContent.tree, {});
      } });
  });
  app.connect("open-ended-view");
</script>
</body></html>
