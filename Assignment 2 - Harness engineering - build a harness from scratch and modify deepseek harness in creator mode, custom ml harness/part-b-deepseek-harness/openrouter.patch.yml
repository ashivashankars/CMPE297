# Route DeepSeek Harness through OpenRouter (any model on openrouter.ai, incl. Gemini with your own key attached there).
#   export OPENROUTER_API_KEY=sk-or-...
#   dsh web --patch ./openrouter.patch.yml          (or append these rows to $DSH_HOME/profiles/web/cordis.patch.yml)
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: openrouter
    model: deepseek/deepseek-chat-v3.1      # any OpenRouter model id, e.g. google/gemini-2.5-pro
