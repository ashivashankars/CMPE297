# gcloud builds submit --config gemini_cli_agent/cloudbuild.yaml --substitutions=_SERVICE=gemini-cli-adk .
substitutions:
  _SERVICE: gemini-cli-adk
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "gemini_cli_agent/Dockerfile", "-t", "gcr.io/$PROJECT_ID/${_SERVICE}", "."]
images: ["gcr.io/$PROJECT_ID/${_SERVICE}"]
